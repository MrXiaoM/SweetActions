# 物品匹配器设置，详见插件文档
item-matcher:
  type: MythicMobs
  mythic: ExampleItem

# 玩家动作匹配器与需求配置
action-matcher:
  # 要求点击操作，可用 LEFT(左键)、RIGHT(右键)
  click: LEFT

  # 是否需要按住潜行键才能匹配操作
  need-sneaking:
    # 是否启用该匹配检查
    enable: true
    # 要求玩家要 按住潜行键 还是 不按住潜行键
    toggle: true
    deny-actions:
      - '[message]&e你需要按住潜行键(Shift)才能执行此操作'

  # 是否需要拥有权限节点才能匹配操作
  # 权限节点设为 none 则无需权限
  permission:
    node: 'none'
    deny-actions:
      - '[message]&e你没有使用该物品的权限'

  # 为点击操作添加冷却时间，设为 0 则无需冷却
  cooldown:
    # 全局冷却
    global-seconds: 0.0
    # 单独玩家冷却
    player-seconds: 1.0
    deny-actions:
      - '[message]&e物品正在冷却中 (%cooldown%s)'

  # 是否需要匹配表达式才能匹配操作
  # 表达式留空则不进行检查
  # 示例 '%vault_eco_balance% >= 100'
  requirement:
    eval: ''
    deny-actions: []

  # 是否需要消耗物品才能执行操作
  # 物品数量不能超过单个物品堆叠上限
  cost-item:
    amount: 1
    deny-actions:
      - '[message]&e你没有足够的物品可消耗'

# 点击操作执行器
# 当以上条件均满足时，执行操作
action-executor:
  # 固定执行操作
  actions: []
  # 按权重执行操作
  weighted-actions:
    # 是否启用该功能
    enable: false
    # 等待上方配置的 actions 运行完成后再执行
    # 可以配合 [delay] 操作和 title 来制作“简易抽奖动画”
    run-after-fixed-actions: true
    # 以下是按权抽取操作的列表
    # 抽中其中一项的几率为 该项权重 除以 所有权重总和
    # 以默认配置为例，总权重为 1+9=10，抽中第一个的概率是 10%，抽中第二个的概率是 90%
    action-list:
      - weight: 1
        actions: []
      - weight: 9
        actions: []
